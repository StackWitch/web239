<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Cat Facts</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #333;
    }
    #fact-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    button {
      background-color: #ffb400;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #ff9900;
    }
    small {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>₍^. .^₎⟆ Random Cat Facts</h1>
  <div id="fact-container">
    <p id="fact">Loading a cat fact...</p>
    <small id="length"></small><br />
    <button id="newFactBtn">Get New Fact</button>
  </div>

  <script>
    async function getCatFact(minLength = 50) {
      const response = await fetch(`https://catfact.ninja/fact?max_length=${minLength}`);
      const data = await response.json();
      document.getElementById("fact").textContent = data.fact;
      document.getElementById("length").textContent = `Fact length: ${data.length} characters`;
    }

    getCatFact();

    document.getElementById("newFactBtn").addEventListener("click", () => {
      const randomLength = Math.floor(Math.random() * 100) + 20; 
      getCatFact(randomLength);
    });
  </script>
</body>
</html>
